<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketch Chat Mode</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --sidebar: #171a21;
      --panel: #20242d;
      --panel-soft: #262b36;
      --border: #383f4d;
      --text: #f2f5f8;
      --muted: #aeb6c2;
      --muted-2: #7f8998;
      --primary: #2f81f7;
      --primary-hover: #1f6feb;
      --success: #2ea043;
      --danger: #ff7b72;
      --danger-soft: rgba(248, 81, 73, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin: 0;
    }

    a {
      color: #8ab4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: sticky;
      top: 0;
    }

    .sidebar-top,
    .sidebar-bottom {
      padding: 18px;
    }

    .sidebar-top {
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .new-button,
    .send-button,
    .build-button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 11px 14px;
    }

    .new-button {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      color: var(--text);
      width: 100%;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      display: grid;
      gap: 8px;
    }

    .section-title {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      margin: 0 6px 10px;
      text-transform: uppercase;
    }

    .recent-list {
      display: grid;
      gap: 8px;
    }

    .recent-item {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      padding: 10px;
      text-align: left;
      width: 100%;
    }

    .recent-item:hover {
      background: var(--panel);
      border-color: var(--border);
    }

    .recent-title {
      color: var(--text);
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-meta {
      color: var(--muted-2);
      font-size: 0.82rem;
      margin-top: 4px;
    }

    .main {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100vh;
      min-width: 0;
    }

    .chat {
      overflow-y: auto;
      padding: 34px 24px 24px;
    }

    .chat-inner,
    .composer-inner {
      margin: 0 auto;
      max-width: 920px;
    }

    .hero {
      margin: 36px 0 30px;
      text-align: center;
    }

    .hero h1 {
      font-size: 2rem;
      margin: 0 0 8px;
    }

    .hero p {
      color: var(--muted);
      margin: 0;
    }

    .messages {
      display: grid;
      gap: 16px;
    }

    .message {
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: min(760px, 100%);
      padding: 14px 16px;
      white-space: pre-wrap;
    }

    .assistant .bubble {
      background: var(--panel);
    }

    .user .bubble {
      background: #1f6feb;
      border-color: #2f81f7;
      color: #ffffff;
    }

    .system .bubble {
      background: #151922;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .error .bubble {
      background: var(--danger-soft);
      border-color: rgba(248, 81, 73, 0.55);
      color: #ffd7d3;
    }

    .message-title {
      color: var(--text);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .meta-grid {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .meta-row {
      color: var(--muted);
    }

    .meta-row strong {
      color: var(--text);
    }

    details {
      border-top: 1px solid var(--border);
      margin-top: 12px;
      padding-top: 10px;
    }

    summary {
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }

    ul {
      margin: 8px 0 0 20px;
      padding: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .build-button {
      background: var(--success);
      color: #ffffff;
    }

    .build-button.danger {
      background: transparent;
      border: 1px solid rgba(248, 81, 73, 0.75);
      color: #ffb4ad;
    }

    .build-button:disabled,
    .send-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .composer {
      background: linear-gradient(180deg, rgba(15, 17, 23, 0), var(--bg) 24px);
      padding: 24px;
    }

    .composer-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(0, 1fr) auto;
      padding: 12px;
    }

    textarea {
      background: transparent;
      border: 0;
      color: var(--text);
      font: inherit;
      max-height: 180px;
      min-height: 52px;
      outline: none;
      resize: vertical;
      width: 100%;
    }

    .send-button {
      align-self: end;
      background: var(--primary);
      color: #ffffff;
      min-width: 96px;
    }

    .send-button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .hint {
      color: var(--muted-2);
      font-size: 0.86rem;
      margin-top: 8px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: auto;
        max-height: 42vh;
        position: relative;
      }

      .main {
        height: auto;
        min-height: 70vh;
      }

      .composer-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">AutoCAD AI</div>
        <button id="new-sketch" class="new-button" type="button">+ New Sketch</button>
      </div>

      <div class="sidebar-scroll">
        <h2 class="section-title">Recent Chats</h2>
        <div id="recent-list" class="recent-list">
          <div class="recent-item">No recent sketches yet.</div>
        </div>
      </div>

      <div class="sidebar-bottom">
        <a href="/">Home</a>
        <a href="/vessel.html">Vessel Generator</a>
        <a href="/jobs.html">Job History</a>
      </div>
    </aside>

    <main class="main">
      <section id="chat" class="chat">
        <div class="chat-inner">
          <div class="hero">
            <h1>Sketch Chat Mode</h1>
            <p>Describe what to draw, or ask for a small edit to the active AutoCAD drawing.</p>
          </div>
          <div id="messages" class="messages"></div>
        </div>
      </section>

      <section class="composer">
        <div class="composer-inner">
          <div class="composer-box">
            <textarea id="prompt" placeholder="Draw a simple rectangle 1000mm wide and 500mm high with a circle in the center and a title above it."></textarea>
            <button id="send" class="send-button" type="button">Send</button>
          </div>
          <div class="hint">Enter sends. Shift+Enter adds a new line. AutoCAD must be open with an active drawing before building or editing.</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const chat = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const newSketchButton = document.getElementById("new-sketch");
    const recentList = document.getElementById("recent-list");
    const RECENT_KEY = "autocad_ai_recent_sketches";
    const CAD3D_TOKEN_KEY = "autocad_ai_latest_cad3d_token";

    let isSending = false;
    let latestGeneration = null;
    let latestCAD3DToken = null;

    try {
      latestCAD3DToken = localStorage.getItem(CAD3D_TOKEN_KEY) || null;
    } catch (error) {
      latestCAD3DToken = null;
    }

    function escapeText(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function createMessage(role, content, options = {}) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}${options.error ? " error" : ""}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (options.html) {
        bubble.innerHTML = content;
      } else {
        bubble.textContent = content;
      }

      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      scrollToBottom();
      return bubble;
    }

    function formatIssue(issue) {
      const severity = issue.severity || "INFO";
      const index = issue.command_index != null ? ` command ${issue.command_index}` : "";
      const fix = issue.suggested_fix ? ` Suggested fix: ${issue.suggested_fix}` : "";
      return `[${severity}]${index}: ${issue.description || ""}${fix}`;
    }

    const CHAT_ROUTES = {
      CAD3D: "cad3d_generate",
      CAD3D_EDIT: "cad3d_edit",
      PID: "pid_generate",
      SKETCH: "sketch_generate",
      EDIT: "autocad_edit"
    };

    function normalizePrompt(text) {
      return String(text || "").toLowerCase().replace(/\s+/g, " ").trim();
    }

    function normalizeForRouting(text) {
      return normalizePrompt(text);
    }

    function isNewDrawingRequest(text) {
      const normalized = normalizePrompt(text);

      const createWords = [
        "draw ",
        "create ",
        "generate ",
        "build ",
        "make ",
        "design ",
        "prepare ",
        "draft "
      ];

      return createWords.some((word) => normalized.startsWith(word));
    }

    const THREE_D_INTENT_PATTERNS = [
      /\b3d\b/,
      /\b3-d\b/,
      /\b3 dimensional\b/,
      /\b3-dimensional\b/,
      /\bthree dimensional\b/,
      /\bthree-dimensional\b/,
      /\bsolid model\b/,
      /\bisometric model\b/
    ];

    const NEGATED_3D_PATTERNS = [
      /\bnot\s+(?:a\s+|an\s+)?(?:3d|3-d|3 dimensional|3-dimensional|three dimensional|three-dimensional|solid model|isometric model)\b/,
      /\bno\s+(?:3d|3-d|3 dimensional|3-dimensional|three dimensional|three-dimensional|solid model|isometric model)\b/,
      /\b(?:do not|don't|dont)\s+(?:create|make|generate|build|draw|use|include)?\s*(?:a\s+|an\s+)?(?:3d|3-d|3 dimensional|3-dimensional|three dimensional|three-dimensional|solid model|isometric model)\b/,
      /\b(?:2d|2-d)\s*,?\s*not\s+(?:a\s+|an\s+)?(?:3d|3-d|3 dimensional|3-dimensional|three dimensional|three-dimensional|solid model|isometric model)\b/,
      /\b(?:3d|3-d|3 dimensional|3-dimensional|three dimensional|three-dimensional|solid model|isometric model)\s+(?:is\s+)?not\b/
    ];

    const TWO_D_INTENT_PATTERNS = [
      /\b2d\b/,
      /\b2-d\b/,
      /\btwo dimensional\b/,
      /\btwo-dimensional\b/,
      /\bflat\b/,
      /\bflat diagram\b/,
      /\b2d drawing\b/,
      /\b2d process layout\b/,
      /\b2d autocad drawing\b/
    ];

    function hasNegated3DIntent(text) {
      const normalized = normalizePrompt(text);
      return NEGATED_3D_PATTERNS.some((pattern) => pattern.test(normalized));
    }

    function hasExplicit3DIntent(text) {
      const normalized = normalizePrompt(text);
      return THREE_D_INTENT_PATTERNS.some((pattern) => pattern.test(normalized));
    }

    function hasExplicit2DIntent(text) {
      const normalized = normalizePrompt(text);
      return TWO_D_INTENT_PATTERNS.some((pattern) => pattern.test(normalized));
    }

    function is3DRequest(text) {
      return hasExplicit3DIntent(text) && !hasNegated3DIntent(text);
    }

    function isPIDRequest(text) {
      const normalized = normalizePrompt(text);

      const strongPIDSignals = [
        "p&id",
        "p and id",
        "piping and instrumentation",
        "piping & instrumentation",
        "instrumentation diagram",
        "process diagram",
        "process unit"
      ];

      if (/(^|[^a-z0-9])pid([^a-z0-9]|$)/.test(normalized)) {
        return true;
      }

      if (strongPIDSignals.some((keyword) => normalized.includes(keyword))) {
        return true;
      }

      const weightedPIDSignals = [
        "separator",
        "horizontal separator",
        "vertical vessel",
        "storage tank",
        "vessel",
        "scrubber",
        "tank",
        "pump",
        "pumps",
        "exchanger",
        "heat exchanger",
        "3 phase",
        "three phase",
        "vapor outlet",
        "oil outlet",
        "water outlet",
        "feed inlet",
        "liquid outlet",
        "suction",
        "discharge",
        "gate valve",
        "control valve",
        "valves",
        "instrument",
        "instruments",
        "instrument bubble",
        "level control",
        "pressure control",
        "pi-",
        "pt-",
        "lt-",
        "lc-",
        "fi-",
        "ti-"
      ];

      const score = weightedPIDSignals.reduce((count, keyword) => {
        return normalized.includes(keyword) ? count + 1 : count;
      }, 0);

      return score >= 2;
    }

    function isEditRequest(text) {
      if (isNewDrawingRequest(text)) {
        return false;
      }

      const normalized = normalizePrompt(text);

      const directEditVerbs = [
        "delete",
        "remove",
        "erase",
        "move",
        "shift",
        "change",
        "rename",
        "modify",
        "update",
        "replace",
        "resize",
        "extend",
        "trim",
        "rotate",
        "edit"
      ];

      const contextEditVerbs = [
        ...directEditVerbs,
        "add",
        "connect"
      ];

      const existingContextWords = [
        "existing",
        "current drawing",
        "current autocad",
        "this drawing",
        "active drawing",
        "the title",
        "title text",
        "the circle",
        "the vessel",
        "the valve",
        "the line",
        "the text",
        "this line",
        "this vessel",
        "that circle",
        "outlet line",
        "separator outlet"
      ];

      const startsWithDirectEditVerb = directEditVerbs.some((verb) => {
        return normalized === verb || normalized.startsWith(`${verb} `);
      });
      const hasContextEditVerb = contextEditVerbs.some((verb) => {
        return normalized === verb || normalized.includes(`${verb} `);
      });
      const hasExistingContext = existingContextWords.some((word) => normalized.includes(word));

      return startsWithDirectEditVerb || (hasContextEditVerb && hasExistingContext);
    }

    const CAD3D_EDIT_VERBS = [
      "move",
      "shift",
      "relocate",
      "change",
      "set",
      "update",
      "resize",
      "increase",
      "decrease",
      "delete",
      "remove",
      "add",
      "place",
      "lengthen",
      "shorten"
    ];

    const CAD3D_EQUIPMENT_TERMS = [
      "pump",
      "tank",
      "vessel",
      "separator",
      "heat exchanger",
      "exchanger",
      "valve",
      "flange",
      "support",
      "support leg",
      "support legs",
      "skid",
      "nozzle",
      "pipe",
      "routed pipe"
    ];

    const CAD3D_COMPONENT_ID_PATTERN = /\b[A-Z]{1,4}-?\d{2,4}[A-Z]?\b/i;

    function latestGenerationIsCAD3D() {
      const generation = typeof latestGeneration !== "undefined" ? latestGeneration : null;
      if (!generation) {
        return false;
      }

      return (
        String(generation.type || "").toLowerCase() === "cad3d" ||
        String(generation.approveUrl || "").includes("/api/cad3d/approve") ||
        String(generation.editUrl || "").includes("/api/cad3d/edit")
      );
    }

    function hasCAD3DContext() {
      const token = typeof latestCAD3DToken !== "undefined" ? latestCAD3DToken : null;
      return latestGenerationIsCAD3D() || Boolean(token);
    }

    function hasCAD3DEditIntent(text) {
      const normalized = normalizePrompt(text);
      if (!normalized) {
        return false;
      }

      const hasEditVerb = CAD3D_EDIT_VERBS.some((verb) => {
        return normalized === verb || normalized.startsWith(`${verb} `) || normalized.includes(` ${verb} `);
      });
      if (!hasEditVerb) {
        return false;
      }

      const hasComponentId = CAD3D_COMPONENT_ID_PATTERN.test(String(text || ""));
      const hasEquipmentTerm = CAD3D_EQUIPMENT_TERMS.some((term) => normalized.includes(term));
      const explicit3DContext = is3DRequest(text);

      return hasComponentId || hasEquipmentTerm || explicit3DContext;
    }

    function shouldRouteToCAD3DEdit(text) {
      if (isNewDrawingRequest(text)) {
        return false;
      }
      if (hasExplicit2DIntent(text)) {
        return false;
      }
      return hasCAD3DContext() && hasCAD3DEditIntent(text);
    }

    function decideChatRoute(text) {
      const newDrawingRequest = isNewDrawingRequest(text);
      const cad3dRequest = is3DRequest(text);
      const pidRequest = isPIDRequest(text);
      const cad3dEditRequest = shouldRouteToCAD3DEdit(text);
      const editRequest = isEditRequest(text);

      if (newDrawingRequest) {
        if (cad3dRequest) {
          return CHAT_ROUTES.CAD3D;
        }
        if (pidRequest) {
          return CHAT_ROUTES.PID;
        }
        return CHAT_ROUTES.SKETCH;
      }

      if (cad3dEditRequest) {
        return CHAT_ROUTES.CAD3D_EDIT;
      }

      if (editRequest) {
        return CHAT_ROUTES.EDIT;
      }

      if (cad3dRequest) {
        return CHAT_ROUTES.CAD3D;
      }

      if (pidRequest) {
        return CHAT_ROUTES.PID;
      }

      return CHAT_ROUTES.SKETCH;
    }

    function detailsHtml(data) {
      const assumptions = Array.isArray(data.assumptions) ? data.assumptions : [];
      const verifier = data.verifier_result || {};
      const issues = Array.isArray(verifier.issues) ? verifier.issues : [];
      const preview = data.preview_download_url;

      const assumptionItems = assumptions.length
        ? assumptions.map((item) => `<li>${escapeText(item)}</li>`).join("")
        : "<li>None</li>";

      const issueItems = issues.length
        ? issues.map((issue) => `<li>${escapeText(formatIssue(issue))}</li>`).join("")
        : "<li>None</li>";

      const previewLine = preview
        ? `<div class="meta-row"><strong>Preview:</strong> <a href="${escapeText(preview)}">DXF preview</a></div>`
        : "";

      return `
        <details>
          <summary>Details</summary>
          <div class="meta-grid">
            <div class="meta-row"><strong>Assumptions</strong></div>
            <ul>${assumptionItems}</ul>
            <div class="meta-row"><strong>Verifier issues</strong></div>
            <ul>${issueItems}</ul>
            <div class="meta-row"><strong>Command count:</strong> ${escapeText(data.command_count)}</div>
            ${previewLine}
          </div>
        </details>
      `;
    }

    function planMessageHtml(data) {
      const verdict = data.verifier_verdict || "SKIPPED";
      const isRejected = verdict === "REJECT";
      const issueCount = data.verifier_result?.issues?.length || 0;

      return `
        <div class="message-title">${isRejected ? "Verifier rejected this plan." : "Generated command plan."}</div>
        <div class="meta-grid">
          <div class="meta-row"><strong>Summary:</strong> ${escapeText(data.summary || "No summary.")}</div>
          <div class="meta-row"><strong>Drawing type:</strong> ${escapeText(data.estimated_drawing_type || "unspecified")}</div>
          <div class="meta-row"><strong>Verifier:</strong> ${escapeText(verdict)}</div>
          <div class="meta-row"><strong>Commands:</strong> ${escapeText(data.command_count)}</div>
          ${issueCount ? `<div class="meta-row"><strong>Issues:</strong> ${issueCount}</div>` : ""}
        </div>
        ${detailsHtml(data)}
        <div class="actions">
          <button class="build-button ${isRejected ? "danger" : ""}" type="button">
            ${isRejected ? "Build Anyway" : "Build in AutoCAD"}
          </button>
        </div>
      `;
    }

    function pidDetailsHtml(data) {
      const assumptions = Array.isArray(data.assumptions) ? data.assumptions : [];
      const componentScene = data.component_scene || {};
      const components = Array.isArray(componentScene.components) ? componentScene.components : [];

      const assumptionItems = assumptions.length
        ? assumptions.map((item) => `<li>${escapeText(item)}</li>`).join("")
        : "<li>None</li>";

      const componentItems = components.length
        ? components.slice(0, 20).map((component) => {
            const label = component.tag || component.label || component.text || component.id;
            return `<li>${escapeText(component.component_type)}: ${escapeText(label)}</li>`;
          }).join("")
        : "<li>None</li>";

      return `
        <details>
          <summary>Details</summary>
          <div class="meta-grid">
            <div class="meta-row"><strong>Assumptions</strong></div>
            <ul>${assumptionItems}</ul>
            <div class="meta-row"><strong>Components</strong></div>
            <ul>${componentItems}</ul>
          </div>
        </details>
      `;
    }

    function pidPlanMessageHtml(data) {
      const fallbackLine = data.fallback_used
        ? `<div class="meta-row"><strong>Fallback:</strong> The AI component planner failed, so I used the deterministic ${escapeText(data.template_name || "P&ID")} template. You can still edit it afterward using chat.</div>`
        : "";
      const templateLine = data.template_name
        ? `<div class="meta-row"><strong>Template:</strong> ${escapeText(data.template_name)}</div>`
        : "";

      return `
        <div class="message-title">P&ID component plan created.</div>
        <div class="meta-grid">
          <div class="meta-row"><strong>Title:</strong> ${escapeText(data.title || "P&ID")}</div>
          <div class="meta-row"><strong>Strategy:</strong> ${escapeText(data.planner_strategy || "unknown")}</div>
          ${templateLine}
          <div class="meta-row"><strong>Components:</strong> ${escapeText(data.component_count)}</div>
          <div class="meta-row"><strong>Commands:</strong> ${escapeText(data.command_count)}</div>
          ${fallbackLine}
          <div class="meta-row">Ready to build in AutoCAD.</div>
        </div>
        ${pidDetailsHtml(data)}
        <div class="actions">
          <button class="build-button" type="button">Build P&amp;ID in AutoCAD</button>
        </div>
      `;
    }

    function buildResultHtml(data) {
      const result = data.execution_result || {};
      return `

        const handle = item.handle ? `handle ${item.handle}: ` : "";
        const command = item.command_index != null ? `command ${item.command_index}: ` : "";
        return `<li>${escapeText(`${type}${handle}${command}${item.error || "Unknown error"}`)}</li>`;

    async function readJson(response) {
      try {
        return await response.json();
      } catch (error) {
        return {};
      }
    }

    function errorMessage(data, fallback) {
      if (typeof data.detail === "string") {
        return data.detail;
      }
      if (data.message) {
        return data.message;
      }
      return fallback;
    }

    function setLatestCAD3DToken(token) {
      latestCAD3DToken = token || null;
      try {
        if (latestCAD3DToken) {
          localStorage.setItem(CAD3D_TOKEN_KEY, latestCAD3DToken);
        } else {
          localStorage.removeItem(CAD3D_TOKEN_KEY);
        }
      } catch (error) {
        // Local storage is best-effort routing state only.
      }
    }

    function currentCAD3DToken() {
      if (latestGenerationIsCAD3D() && latestGeneration?.token) {
        return latestGeneration.token;
      }
      return latestCAD3DToken;
    }

    async function fetchLatestCAD3DToken() {
      const response = await fetch("/api/cad3d/state/latest", {
        method: "GET"
      });
      const data = await readJson(response);

      if (!response.ok || !data.ok || !data.record?.token) {
        throw new Error("No stored CAD3D scene is available to edit. Generate a 3D model first.");
      }

      setLatestCAD3DToken(data.record.token);
      return data.record.token;
    }

    function editApiErrorMessage(response, data) {
      if (response.status === 503) {
        return "I could not apply that edit because AutoCAD is not reachable. Open AutoCAD with an active drawing and try again.";
      }

      if (response.status === 400) {
        return `I could not understand that edit clearly enough to apply it. ${errorMessage(data, "")}`.trim();
      }

      if (response.status === 502) {
        return `I could not generate a valid edit plan. ${errorMessage(data, "")}`.trim();
      }

      if (response.status >= 500) {
        return `The backend hit an error while applying the live edit. ${errorMessage(data, "")}`.trim();
      }

      return errorMessage(data, "I could not apply that edit.");
    }

    function cad3dEditApiErrorMessage(response, data) {
      if (response.status === 503) {
        return "I could not rebuild the edited 3D model because AutoCAD is not reachable. Open AutoCAD with an active drawing and try again.";
      }
      if (response.status === 404) {
        return "I could not find a stored CAD3D scene to edit. Generate a 3D model first.";
      }
      if (response.status === 400) {
        return `I could not apply that CAD3D component edit. ${errorMessage(data, "")}`.trim();
      }
      if (response.status >= 500) {
        return `The backend hit an error while rebuilding the edited CAD3D scene. ${errorMessage(data, "")}`.trim();
      }
      return errorMessage(data, "I could not apply that CAD3D edit.");
    }

    function setSending(value) {
      isSending = value;
      sendButton.disabled = value;
      sendButton.textContent = value ? "Sending..." : "Send";
    }

    function loadRecent() {
      try {
        return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
      } catch (error) {
        return [];
      }
    }

    function saveRecent(item) {
      const next = [
        item,
        ...loadRecent().filter((existing) => existing.prompt !== item.prompt)
      ].slice(0, 20);
      localStorage.setItem(RECENT_KEY, JSON.stringify(next));
      renderRecent();
    }

    function renderRecent() {
      const items = loadRecent();
      recentList.innerHTML = "";

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "recent-item";
        empty.textContent = "No recent chats yet.";
        recentList.appendChild(empty);
        return;
      }

      for (const item of items) {
        const button = document.createElement("button");
        button.className = "recent-item";
        button.type = "button";
        button.innerHTML = `
          <div class="recent-title">${escapeText(item.prompt)}</div>
          <div class="recent-meta">${escapeText(item.verdict || "planned")} | ${escapeText(item.time || "")}</div>
        `;
        button.addEventListener("click", () => {
          promptInput.value = item.prompt || "";
          promptInput.focus();
        });
        recentList.appendChild(button);
      }
    }

    async function generatePlan(prompt) {
      latestGeneration = null;
      const status = createMessage("system", "Generating command plan...");

      const response = await fetch("/api/sketch/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt,
          run_verifier: true,
          create_preview: false
        })
      });
      const data = await readJson(response);

      if (!response.ok || !data.ok) {
        status.textContent = "Generation failed.";
        throw new Error(errorMessage(data, "Could not generate a sketch plan."));
      }

      data.route_type = CHAT_ROUTES.SKETCH;
      latestGeneration = {
        token: data.token,
        type: "sketch",
        approveUrl: "/api/sketch/approve"
      };
      status.textContent = "Plan generated. Review it before building in AutoCAD.";
      const planBubble = createMessage("assistant", planMessageHtml(data), { html: true });
      const buildButton = planBubble.querySelector(".build-button");

      buildButton.addEventListener("click", () => buildInAutoCAD(data, buildButton));

      saveRecent({
        prompt,
        summary: data.summary,
        verdict: data.verifier_verdict,
        time: new Date().toLocaleString()
      });
    }

    async function buildInAutoCAD(plan, button) {
      button.disabled = true;
      button.textContent = "Building...";

      const status = createMessage(
        "system",
        "Connecting to AutoCAD...\nExecuting commands...\nZooming to generated drawing..."
      );

      try {
        const response = await fetch("/api/sketch/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: plan.token,
            save: false,
            target_dwg_path: null
          })
        });
        const data = await readJson(response);

        if (response.status === 503) {
          status.textContent = "AutoCAD is not reachable. Open AutoCAD with a drawing active, then click Build again.";
          button.disabled = false;
          button.textContent = plan.verifier_verdict === "REJECT" ? "Build Anyway" : "Build in AutoCAD";
          return;
        }

        if (!response.ok) {
          throw new Error(errorMessage(data, "Could not build in AutoCAD."));
        }

        if (!data.ok) {
          status.textContent = "AutoCAD reported execution issues. Review the details below.";
          createMessage("assistant", buildResultHtml(data), { html: true, error: true });
          button.disabled = false;
          button.textContent = plan.verifier_verdict === "REJECT" ? "Build Anyway" : "Build in AutoCAD";
          return;
        }

        status.textContent = "Done.";
        createMessage("assistant", buildResultHtml(data), { html: true });
      } catch (error) {
        status.textContent = "Build failed.";
        createMessage("assistant", String(error.message || error), { error: true });
        button.disabled = false;
        button.textContent = plan.verifier_verdict === "REJECT" ? "Build Anyway" : "Build in AutoCAD";
      }
    }

          sourceToken = await fetchLatestCAD3DToken();
        }

        status.textContent = "Applying CAD3D component edit and rebuilding the 3D model...";

        const response = await fetch("/api/cad3d/edit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            token: sourceToken,
            execute: true,
            save: false,
            target_dwg_path: null,
            create_new_token: true
          })
        });
        const data = await readJson(response);

        if (!response.ok) {
          status.textContent = "CAD3D edit failed.";
          throw new Error(cad3dEditApiErrorMessage(response, data));
        }

        if (data.edited_token) {
          setLatestCAD3DToken(data.edited_token);
          latestGeneration = {
            token: data.edited_token,
            type: "cad3d",
            approveUrl: "/api/cad3d/approve",
            editUrl: "/api/cad3d/edit"
          };
        }

        if (!data.ok) {
          status.textContent = "CAD3D edit ran, but AutoCAD reported issues.";
          createMessage("assistant", cad3dEditResultHtml(data), { html: true, error: true });
        } else {
          const documentName = data.execution_result?.document_name || "the active drawing";
          status.textContent = `Done — rebuilt ${documentName}.`;
          createMessage("assistant", cad3dEditResultHtml(data), { html: true });
        }

        saveRecent({
          prompt,
          summary: data.edit_plan?.summary,
          verdict: data.ok ? "cad3d edited" : "cad3d edit issues",
          time: new Date().toLocaleString()
        });
      } catch (error) {
        createMessage("assistant", String(error.message || error), { error: true });
      }
    }

    async function applyLiveEdit(prompt) {
      const status = createMessage("system", "Inspecting active AutoCAD drawing...");

      try {
        status.textContent = "Working on the active AutoCAD drawing...\nInspecting current entities...\nPlanning and applying the edit...";

        const response = await fetch("/api/autocad/edit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            max_entities: 200,
            auto_execute: true,
            save: false,
            target_dwg_path: null
          })
        });
        const data = await readJson(response);

        if (!response.ok) {
          status.textContent = "Live edit failed.";
          throw new Error(editApiErrorMessage(response, data));
        }

        if (!data.ok) {
          status.textContent = "Edit plan ran, but AutoCAD reported issues.";
          createMessage("assistant", editResultHtml(data), { html: true, error: true });
        } else {
          const documentName = data.execution_result?.document_name || data.document_name || "the active drawing";
          status.textContent = `Done — updated ${documentName}.`;
          createMessage("assistant", editResultHtml(data), { html: true });
        }

        saveRecent({
          prompt,
          summary: data.edit_plan?.summary,
          verdict: data.ok ? "edited" : "edit issues",
          time: new Date().toLocaleString()
        });
      } catch (error) {
        createMessage("assistant", String(error.message || error), { error: true });
      }
    }

    async function sendPrompt() {
      const prompt = promptInput.value.trim();
      if (!prompt || isSending) {
        return;
      }

      promptInput.value = "";
      createMessage("user", prompt);
      setSending(true);

      try {
        const newDrawingRequest = isNewDrawingRequest(prompt);
        const cad3dRequest = is3DRequest(prompt);
        const pidRequest = isPIDRequest(prompt);
        const cad3dContext = hasCAD3DContext();
        const cad3dEditIntent = hasCAD3DEditIntent(prompt);
        const cad3dEditRoute = shouldRouteToCAD3DEdit(prompt);
        const editRequest = isEditRequest(prompt);

        console.log("Routing message:", prompt);
        console.log("isNewDrawingRequest:", newDrawingRequest);
        console.log("is3DRequest:", cad3dRequest);
        console.log("isPIDRequest:", pidRequest);
        console.log("hasCAD3DContext:", cad3dContext);
        console.log("hasCAD3DEditIntent:", cad3dEditIntent);
        console.log("shouldRouteToCAD3DEdit:", cad3dEditRoute);
        console.log("isEditRequest:", editRequest);
        const route = decideChatRoute(prompt);
        console.log("decideChatRoute:", route);

        if (route === CHAT_ROUTES.CAD3D) {
          console.log("Route selected: CAD3D");
          await handleCAD3DRequest(prompt);
        } else if (route === CHAT_ROUTES.CAD3D_EDIT) {
          console.log("Route selected: CAD3D_EDIT");
          await handleCAD3DEditRequest(prompt);
        } else if (route === CHAT_ROUTES.PID) {
          console.log("Route selected: PID");
          await handlePIDRequest(prompt);
        } else if (route === CHAT_ROUTES.EDIT) {
          console.log("Route selected: EDIT");
          await applyLiveEdit(prompt);
        } else {
          console.log("Route selected: SKETCH");
          await generatePlan(prompt);
        }
      } catch (error) {
        createMessage("assistant", String(error.message || error), { error: true });
      } finally {
        setSending(false);
        promptInput.focus();
      }
    }

    sendButton.addEventListener("click", sendPrompt);
    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendPrompt();
      }
    });

    newSketchButton.addEventListener("click", () => {
      latestGeneration = null;
      messages.innerHTML = "";
      promptInput.value = "";
      promptInput.focus();
    });

    renderRecent();
    createMessage("assistant", "Open AutoCAD with an active drawing. Describe a new sketch to build, or ask for a small edit to the current drawing.");
  </script>
</body>
</html>
